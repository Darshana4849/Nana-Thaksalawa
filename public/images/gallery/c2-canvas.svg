<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <!-- Top canvas window bar -->
  <rect x="0" y="0" width="600" height="42" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <text x="80" y="26" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600">Letter Helper · Writing Practice Canvas (Sinhala Letter "අ")</text>

  <!-- Canvas Ruling paper lines -->
  <line x1="40" y1="90" x2="560" y2="90" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="40" y1="150" x2="560" y2="150" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="210" x2="560" y2="210" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="40" y1="270" x2="560" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Tracing Stroke and Ordered Checkpoints -->
  <g transform="translate(180, 70)">
    <path d="M 50 65 C 38 42, 68 25, 100 28 C 130 32, 145 58, 140 82 C 132 108, 108 116, 88 116 C 65 116, 52 98, 60 84 C 68 70, 88 74, 92 84"
          fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
    <path d="M 100 116 Q 130 116, 148 138" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>

    <!-- Keypoint Circles -->
    <circle cx="50" cy="65" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <text x="50" y="69" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">1</text>
    
    <circle cx="100" cy="28" r="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="140" cy="82" r="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="88" cy="116" r="6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="148" cy="138" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Stylus Nib -->
    <polygon points="140,82 152,65 160,73" fill="#F59E0B"/>
  </g>

  <!-- Live Feedback Tag -->
  <rect x="420" y="300" width="150" height="30" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="495" y="320" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="11" font-weight="bold">Score: 92% (Low Support)</text>
</svg>
