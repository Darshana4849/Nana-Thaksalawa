<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" rx="16" fill="#0F172A"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="42" fill="#1E293B"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  <text x="80" y="26" fill="#94A3B8" font-family="monospace" font-size="12">PyTorch CNN Residual [2, 2, 2] Confusion Matrix &amp; Test Metrics</text>
  
  <!-- Grid representation of 22-class confusion matrix -->
  <g transform="translate(60, 65)">
    <!-- Confusion matrix heatmap blocks -->
    <rect x="0" y="0" width="220" height="220" fill="#1E293B" rx="8" stroke="#334155"/>
    <line x1="0" y1="0" x2="220" y2="220" stroke="#3B82F6" stroke-width="24" stroke-linecap="round" opacity="0.85"/>
    <text x="110" y="245" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Predicted 22 Classes</text>
  </g>

  <!-- Metric indicators -->
  <g transform="translate(330, 80)">
    <rect x="0" y="0" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11">Test Accuracy</text>
    <text x="16" y="44" fill="#38BDF8" font-family="monospace" font-size="20" font-weight="bold">96.75%</text>

    <rect x="0" y="66" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="88" fill="#94A3B8" font-family="sans-serif" font-size="11">Test Macro F1-Score</text>
    <text x="16" y="110" fill="#34D399" font-family="monospace" font-size="20" font-weight="bold">96.76%</text>

    <rect x="0" y="132" width="220" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="154" fill="#94A3B8" font-family="sans-serif" font-size="11">Balanced Test Accuracy</text>
    <text x="16" y="176" fill="#FBBF24" font-family="monospace" font-size="20" font-weight="bold">96.74%</text>
  </g>
</svg>
