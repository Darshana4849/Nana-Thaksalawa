<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F2847"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="700" height="480" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="560" cy="90" r="140" fill="#2563EB" opacity="0.12"/>
  <circle cx="120" cy="380" r="160" fill="#0D9488" opacity="0.10"/>

  <!-- Main Application Window Card -->
  <g filter="url(#shadow)" transform="translate(40, 36)">
    <!-- Window frame -->
    <rect width="620" height="408" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Window Title Bar -->
    <rect width="620" height="46" rx="18" fill="#F8FAFC"/>
    <rect y="36" width="620" height="10" fill="#F8FAFC"/>
    <line x1="0" y1="46" x2="620" y2="46" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Window Traffic Lights -->
    <circle cx="28" cy="23" r="5.5" fill="#EF4444"/>
    <circle cx="46" cy="23" r="5.5" fill="#F59E0B"/>
    <circle cx="64" cy="23" r="5.5" fill="#10B981"/>
    
    <!-- Window Title Text & Status -->
    <text x="88" y="27" fill="#1E293B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Letter Helper · Interactive Learning Suite</text>
    <rect x="465" y="12" width="135" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <circle cx="478" cy="23" r="3.5" fill="#2563EB"/>
    <text x="488" y="27" fill="#1D4ED8" font-family="sans-serif" font-size="10.5" font-weight="600">AI Guided Tracing</text>

    <!-- Main Content Area: Left Panel (Drawing Canvas) -->
    <g transform="translate(24, 64)">
      <!-- Canvas Card -->
      <rect width="360" height="316" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      
      <!-- Canvas Header -->
      <text x="18" y="28" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Sinhala Character Practice: "අ"</text>
      <text x="18" y="44" fill="#64748B" font-family="sans-serif" font-size="10.5">Primary Grade Handwriting Scaffold (Stage 1)</text>
      <line x1="18" y1="54" x2="342" y2="54" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Handwriting Ruled Grid -->
      <line x1="24" y1="95" x2="336" y2="95" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="24" y1="145" x2="336" y2="145" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="24" y1="195" x2="336" y2="195" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="24" y1="245" x2="336" y2="245" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Sinhala Character Ghost / Background -->
      <text x="180" y="215" text-anchor="middle" fill="#E2E8F0" font-family="'Iskoola Pota', 'Noto Sans Sinhala', sans-serif" font-size="135" font-weight="bold">අ</text>

      <!-- Active Stroke & Guide Points -->
      <path d="M 120 135 C 105 105, 140 85, 180 88 C 220 92, 238 125, 230 155 C 220 185, 185 195, 160 195 C 130 195, 115 175, 125 158 C 135 142, 160 146, 165 158"
            fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
      <path d="M 175 195 Q 215 195, 235 228" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>

      <!-- Checkpoints with Numbers -->
      <circle cx="120" cy="135" r="9" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="120" y="139" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">1</text>
      
      <circle cx="180" cy="88" r="7.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="230" cy="155" r="7.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="160" cy="195" r="7.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="235" cy="228" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="235" y="232" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">5</text>

      <!-- Stylus Nib Indicator -->
      <g transform="translate(230, 155)">
        <polygon points="0,0 14,-22 24,-12" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
        <circle cx="0" cy="0" r="3" fill="#EF4444"/>
      </g>

      <!-- Bottom Score Bar -->
      <rect x="18" y="272" width="324" height="32" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="32" y="292" fill="#334155" font-family="sans-serif" font-size="11" font-weight="600">Stroke Accuracy: 94.8%</text>
      <text x="260" y="292" fill="#059669" font-family="sans-serif" font-size="11" font-weight="700">Excellent ★★★</text>
    </g>

    <!-- Right Side Information Column -->
    <g transform="translate(402, 64)">
      <!-- CNN Model Stat Card -->
      <rect width="194" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="24" fill="#64748B" font-family="sans-serif" font-size="10.5" font-weight="600" text-transform="uppercase">CNN Recognition</text>
      <text x="14" y="52" fill="#1E293B" font-family="sans-serif" font-size="24" font-weight="800">96.75%</text>
      <text x="14" y="70" fill="#059669" font-family="sans-serif" font-size="10.5" font-weight="600">✓ 22 Sinhala Classes</text>
      <rect x="14" y="78" width="166" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="14" y="78" width="160" height="5" rx="2.5" fill="#10B981"/>

      <!-- Adaptive Scaffolding Card -->
      <g transform="translate(0, 108)">
        <rect width="194" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="14" y="24" fill="#64748B" font-family="sans-serif" font-size="10.5" font-weight="600" text-transform="uppercase">Adaptive Guidance</text>
        <text x="14" y="50" fill="#2563EB" font-family="sans-serif" font-size="18" font-weight="700">Level: High</text>
        <text x="14" y="68" fill="#64748B" font-family="sans-serif" font-size="10.5">3-Attempt Moving Avg</text>
        <text x="14" y="84" fill="#0D9488" font-family="sans-serif" font-size="10.5" font-weight="600">Dynamic Support Fading</text>
      </g>

      <!-- Letters Bank Card -->
      <g transform="translate(0, 216)">
        <rect width="194" height="100" rx="12" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
        <text x="14" y="24" fill="#1E40AF" font-family="sans-serif" font-size="11" font-weight="700">Sinhala Letter Deck</text>
        <!-- Letters pill row -->
        <g transform="translate(14, 34)">
          <rect x="0" y="0" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
          <text x="17" y="24" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">අ</text>
          
          <rect x="42" y="0" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
          <text x="59" y="24" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">ආ</text>

          <rect x="84" y="0" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
          <text x="101" y="24" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">ක</text>

          <rect x="126" y="0" width="34" height="34" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
          <text x="143" y="24" text-anchor="middle" fill="#1E293B" font-family="sans-serif" font-size="16" font-weight="bold">ග</text>
        </g>
        <text x="14" y="86" fill="#3B82F6" font-family="sans-serif" font-size="10.5" font-weight="600">SLIIT Final-Year Research 2026</text>
      </g>
    </g>
  </g>
</svg>
